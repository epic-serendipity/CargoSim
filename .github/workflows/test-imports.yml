name: Test Imports and Paths

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_qt.txt
    
    - name: Test imports
      run: python scripts/test_imports.py
    
    - name: Test paths
      run: python scripts/test_paths.py
    
    - name: Test basic functionality
      run: |
        python -c "import cargosim; print('Main package import successful')"
        python -c "import cargosim.core.config; print('Config import successful')"
        python -c "import cargosim.core.simulation; print('Simulation import successful')"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          logs/
          *.log
